# Quick local run (http://localhost:3000). For a real server use deploy/ (HTTPS + backups).
#   SESSION_SECRET=some-long-random-text docker compose up -d --build
#   docker compose exec app node scripts/migrate.mjs
#   docker compose exec app node scripts/seed.mjs --demo     # or without --demo for an empty school
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: silambam
      POSTGRES_USER: silambam
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://silambam:${DB_PASSWORD:-change-me}@db:5432/silambam
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to a long random string}
    ports:
      - "3000:3000"
volumes:
  pgdata:
