# GitHub Codespaces / VS Code Dev Containers: Node 22 workspace + PostgreSQL 16.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # share the database container's network so Postgres is on localhost:5432
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: silambam
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
